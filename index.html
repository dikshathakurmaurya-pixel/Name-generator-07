<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<meta name="theme-color"
content="#050505">

<title>JUMPX - Jump Counter</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050505;
    color:white;
    min-height:100vh;
}

header{
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid #222;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#00ff88;
}

.status{
    font-size:11px;
    color:#777;
    font-weight:bold;
}

.container{
    width:96%;
    max-width:700px;
    margin:auto;
    padding:10px 0 35px;
}

/* BIG CAMERA */

.camera-box{
    position:relative;
    width:100%;
    height:78vh;
    min-height:500px;
    max-height:850px;
    background:#111;
    border:1px solid #292929;
    border-radius:16px;
    overflow:hidden;
}

#video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    transform:scaleX(-1);
}

.camera-message{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#aaa;
    font-size:15px;
    padding:20px;
    pointer-events:none;
    z-index:3;
}

.corner{
    position:absolute;
    width:30px;
    height:30px;
    border-color:#00ff88;
    border-style:solid;
    z-index:4;
}

.c1{
    top:14px;
    left:14px;
    border-width:2px 0 0 2px;
}

.c2{
    top:14px;
    right:14px;
    border-width:2px 2px 0 0;
}

.c3{
    bottom:14px;
    left:14px;
    border-width:0 0 2px 2px;
}

.c4{
    bottom:14px;
    right:14px;
    border-width:0 2px 2px 0;
}

/* COUNTER */

.counter{
    text-align:center;
    padding:20px 0 12px;
}

.label{
    color:#777;
    font-size:12px;
    letter-spacing:4px;
    font-weight:bold;
}

.number{
    font-size:88px;
    line-height:1;
    font-weight:900;
}

/* GOAL */

.goal-box{
    background:#101010;
    border:1px solid #222;
    border-radius:14px;
    padding:15px;
}

.goal-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:13px;
}

.goal-top span:first-child{
    color:#999;
}

.progress{
    height:8px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#00ff88;
    transition:.2s;
}

/* BUTTONS */

.buttons{
    display:flex;
    gap:10px;
    margin-top:14px;
}

button{
    border:0;
    border-radius:12px;
    padding:17px;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
}

.start{
    flex:1;
    background:#00ff88;
    color:#000;
}

.reset{
    width:110px;
    background:#1b1b1b;
    color:white;
    border:1px solid #292929;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:14px;
}

.stat{
    background:#101010;
    border:1px solid #222;
    border-radius:13px;
    padding:15px 5px;
    text-align:center;
}

.stat-number{
    font-size:22px;
    font-weight:900;
}

.stat-label{
    color:#777;
    font-size:10px;
    margin-top:5px;
    letter-spacing:1px;
}

/* INFO */

.info{
    background:#101010;
    border:1px solid #222;
    border-radius:14px;
    padding:18px;
    margin-top:14px;
}

.info h3{
    font-size:15px;
    margin-bottom:10px;
}

.info p{
    color:#888;
    font-size:12px;
    line-height:1.8;
}

.ready{
    color:#00ff88;
    font-weight:bold;
    margin-top:10px;
    font-size:12px;
}

/* MOBILE */

@media(max-width:500px){

    .container{
        width:98%;
    }

    .camera-box{
        height:76vh;
        min-height:470px;
    }

    .number{
        font-size:75px;
    }

    .buttons{
        flex-direction:column;
    }

    .reset{
        width:100%;
    }

}

</style>

</head>

<body>

<header>

    <div class="logo">
        JUMP<span>X</span>
    </div>

    <div
        class="status"
        id="status">

        CAMERA OFF

    </div>

</header>


<div class="container">


<!-- CAMERA -->

<div class="camera-box">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="canvas"></canvas>

    <div
        class="camera-message"
        id="message">

        Press START CAMERA

    </div>

    <div class="corner c1"></div>
    <div class="corner c2"></div>
    <div class="corner c3"></div>
    <div class="corner c4"></div>

</div>


<!-- COUNTER -->

<div class="counter">

    <div class="label">
        JUMPS
    </div>

    <div
        class="number"
        id="count">

        0

    </div>

</div>


<!-- GOAL -->

<div class="goal-box">

    <div class="goal-top">

        <span>
            DAILY GOAL
        </span>

        <span id="goalText">
            0 / 50
        </span>

    </div>

    <div class="progress">

        <div
            class="progress-bar"
            id="progress">
        </div>

    </div>

</div>


<!-- BUTTONS -->

<div class="buttons">

    <button
        class="start"
        id="startBtn"
        onclick="startCamera()">

        📷 START CAMERA

    </button>

    <button
        class="reset"
        onclick="resetCounter()">

        ↻ RESET

    </button>

</div>


<!-- STATS -->

<div class="stats">

    <div class="stat">

        <div
            class="stat-number"
            id="best">

            0

        </div>

        <div class="stat-label">
            BEST
        </div>

    </div>


    <div class="stat">

        <div
            class="stat-number"
            id="today">

            0

        </div>

        <div class="stat-label">
            TODAY
        </div>

    </div>


    <div class="stat">

        <div class="stat-number">
            50
        </div>

        <div class="stat-label">
            GOAL
        </div>

    </div>

</div>


<!-- INFO -->

<div class="info">

    <h3>
        HOW TO USE
    </h3>

    <p>

        1. Phone ko stable jagah par rakho.<br>

        2. Full body camera mein visible rakho.<br>

        3. START CAMERA dabao.<br>

        4. 2 seconds seedhe khade raho.<br>

        5. "READY - JUMP NOW" aane ke baad jump karo.

    </p>

    <div class="ready"
         id="readyText">

        Waiting for camera...

    </div>

</div>


</div>


<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>


<script>

/* =========================
   ELEMENTS
========================= */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const countElement =
document.getElementById("count");

const bestElement =
document.getElementById("best");

const todayElement =
document.getElementById("today");

const progressElement =
document.getElementById("progress");

const goalText =
document.getElementById("goalText");

const statusElement =
document.getElementById("status");

const messageElement =
document.getElementById("message");

const readyText =
document.getElementById("readyText");

const startButton =
document.getElementById("startBtn");


/* =========================
   SETTINGS
========================= */

const GOAL = 50;

/*
   Jump sensitivity.

   LOWER = easier detection
   HIGHER = harder detection
*/

const JUMP_THRESHOLD = 0.018;


/* =========================
   VARIABLES
========================= */

let count = 0;

let best =
Number(
    localStorage.getItem("jumpBest")
) || 0;

let stream = null;

let running = false;

let calibrated = false;

let calibrationFrames = 0;

let baselineHip = 0;

let highestHip = 0;

let jumpState = "GROUND";

let lastJumpTime = 0;


/* =========================
   UI
========================= */

function updateUI(){

    countElement.textContent =
        count;

    bestElement.textContent =
        best;

    todayElement.textContent =
        count;

    goalText.textContent =
        count + " / " + GOAL;

    const percent =
        Math.min(
            count / GOAL * 100,
            100
        );

    progressElement.style.width =
        percent + "%";
}


/* =========================
   ADD JUMP
========================= */

function addJump(){

    count++;

    if(count > best){

        best = count;

        localStorage.setItem(
            "jumpBest",
            best
        );

    }

    updateUI();

    if(navigator.vibrate){

        navigator.vibrate(60);

    }

}


/* =========================
   RESET
========================= */

function resetCounter(){

    count = 0;

    calibrated = false;

    calibrationFrames = 0;

    baselineHip = 0;

    highestHip = 0;

    jumpState = "GROUND";

    lastJumpTime = 0;

    messageElement.textContent =
        "Press START CAMERA";

    readyText.textContent =
        "Waiting for camera...";

    updateUI();

}


/* =========================
   MEDIAPIPE
========================= */

const pose =
new Pose({

    locateFile:function(file){

        return
        "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file;

    }

});


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    minDetectionConfidence:0.5,

    minTrackingConfidence:0.5

});


/* =========================
   POSE RESULTS
========================= */

pose.onResults(function(results){

    if(!running)
        return;


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* NO BODY */

    if(!results.poseLandmarks){

        messageElement.textContent =
            "BODY NOT DETECTED";

        readyText.textContent =
            "Move into camera view";

        return;

    }


    /* BODY FOUND */

    messageElement.textContent =
        "BODY DETECTED";


    /* DRAW SKELETON */

    drawConnectors(

        ctx,

        results.poseLandmarks,

        POSE_CONNECTIONS,

        {
            color:"#00ff88",
            lineWidth:4
        }

    );


    drawLandmarks(

        ctx,

        results.poseLandmarks,

        {
            color:"#ffffff",
            lineWidth:2,
            radius:4
        }

    );


    /* HIPS */

    const leftHip =
        results.poseLandmarks[23];

    const rightHip =
        results.poseLandmarks[24];


    if(!leftHip || !rightHip)
        return;


    /*
       Average hip position
    */

    const hipY =
        (
            leftHip.y +
            rightHip.y
        ) / 2;


    /* =========================
       CALIBRATION
    ========================= */

    if(!calibrated){

        calibrationFrames++;

        /*
           Slowly calculate
           standing position
        */

        baselineHip =
            (
                baselineHip *
                (calibrationFrames - 1)
                +
                hipY
            )
            /
            calibrationFrames;


        messageElement.textContent =
            "STAND STILL";


        readyText.textContent =
            "Calibrating... " +
            Math.min(
                Math.round(
                    calibrationFrames / 30 * 100
                ),
                100
            ) +
            "%";


        if(calibrationFrames >= 30){

            calibrated = true;

            highestHip =
                baselineHip;

            jumpState =
                "GROUND";

            messageElement.textContent =
                "READY - JUMP NOW";

            readyText.textContent =
                "🟢 READY - JUMP NOW";

        }

        return;

    }


    /* =========================
       JUMP DETECTION
    ========================= */

    const rise =
        baselineHip - hipY;


    /*
       BODY GOES UP
    */

    if(
        jumpState === "GROUND" &&
        rise > JUMP_THRESHOLD
    ){

        jumpState =
            "AIR";

        highestHip =
            hipY;

        messageElement.textContent =
            "⬆ IN AIR";

    }


    /*
       While in air,
       remember highest point
    */

    if(
        jumpState === "AIR"
    ){

        if(
            hipY < highestHip
        ){

            highestHip =
                hipY;

        }


        /*
           Body must come
           noticeably back down
        */

        const returned =
            hipY >
            baselineHip - 0.006;


        if(returned){

            const now =
                Date.now();


            if(
                now - lastJumpTime >
                500
            ){

                addJump();

                lastJumpTime =
                    now;

                messageElement.textContent =
                    "🔥 JUMP +1";

            }


            jumpState =
                "GROUND";

        }

    }

});


/* =========================
   START CAMERA
========================= */

async function startCamera(){

    if(running){

        stopCamera();

        return;

    }


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        alert(
            "Camera API available nahi hai."
        );

        return;

    }


    try{

        statusElement.textContent =
            "REQUESTING CAMERA...";


        statusElement.style.color =
            "#00ff88";


        messageElement.textContent =
            "ALLOW CAMERA";


        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false

            });


        video.srcObject =
            stream;


        video.muted =
            true;


        video.playsInline =
            true;


        await video.play();


        running =
            true;


        calibrated =
            false;


        calibrationFrames =
            0;


        baselineHip =
            0;


        highestHip =
            0;


        jumpState =
            "GROUND";


        startButton.textContent =
            "⏹ STOP CAMERA";


        statusElement.textContent =
            "CAMERA ON";


        readyText.textContent =
            "Calibrating...";


        processCamera();


    }

    catch(error){

        console.error(error);


        statusElement.textContent =
            "CAMERA ERROR";


        statusElement.style.color =
            "#ff4444";


        if(
            error.name ===
            "NotAllowedError"
        ){

            alert(
                "Camera permission denied. App settings mein Camera Allow karo."
            );

        }

        else if(
            error.name ===
            "NotReadableError"
        ){

            alert(
                "Camera kisi aur app mein use ho raha hai."
            );

        }

        else{

            alert(
                "Camera Error: " +
                error.name
            );

        }

    }

}


/* =========================
   PROCESS CAMERA
========================= */

async function processCamera(){

    if(!running)
        return;


    if(video.readyState >= 2){

        try{

            await pose.send({
                image:video
            });

        }

        catch(error){

            console.log(
                "Pose error:",
                error
            );

        }

    }


    requestAnimationFrame(
        processCamera
    );

}


/* =========================
   STOP CAMERA
========================= */

function stopCamera(){

    running =
        false;


    if(stream){

        stream
        .getTracks()
        .forEach(
            function(track){

                track.stop();

            }
        );

        stream =
            null;

    }


    video.srcObject =
        null;


    startButton.textContent =
        "📷 START CAMERA";


    statusElement.textContent =
        "CAMERA OFF";


    statusElement.style.color =
        "#777";


    messageElement.textContent =
        "Press START CAMERA";


    readyText.textContent =
        "Waiting for camera...";


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    calibrated =
        false;


    calibrationFrames =
        0;


    baselineHip =
        0;


    highestHip =
        0;


    jumpState =
        "GROUND";

}


/* =========================
   START
========================= */

updateUI();


/* =========================
   CLEANUP
========================= */

window.addEventListener(
    "beforeunload",
    function(){

        stopCamera();

    }
);

</script>

</body>
</html>
