<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CONFIDENCE</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#050505;
  color:white;
  min-height:100vh;
  overflow:hidden;
}

header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:900;
  letter-spacing:4px;
}

#cameraBox{
  position:relative;
  width:94%;
  height:72vh;
  margin:auto;
  border-radius:25px;
  overflow:hidden;
  background:#111;
  border:1px solid #333;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

#status{
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.7);
  padding:9px 15px;
  border-radius:20px;
  font-size:12px;
  letter-spacing:1px;
  z-index:5;
}

.controls{
  position:absolute;
  bottom:20px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:10;
}

button{
  border:0;
  border-radius:14px;
  padding:14px 18px;
  background:#fff;
  color:#000;
  font-weight:800;
  cursor:pointer;
}

#go{
  background:#111;
  color:white;
  border:1px solid #555;
}

#go.active{
  background:white;
  color:black;
}

#start{
  position:fixed;
  inset:0;
  background:#050505;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
}

#start h1{
  font-size:42px;
  letter-spacing:7px;
}

#start p{
  color:#aaa;
}

#start button{
  padding:16px 35px;
  font-size:16px;
}
</style>
</head>

<body>

<div id="start">
  <h1>CONFIDENCE</h1>
  <p>Face the camera to activate the edit.</p>
  <button onclick="startApp()">START</button>
</div>

<header>CONFIDENCE</header>

<div id="cameraBox">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="status">WAITING FOR CAMERA</div>

  <div class="controls">
    <button id="go" onclick="manualTrigger()">GO 💀</button>
    <button onclick="switchCamera()">FLIP 🔄</button>
    <button onclick="toggleMusic()">FUNK 🔊</button>
    <button onclick="capture()">PHOTO 📸</button>
  </div>
</div>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const statusText=document.getElementById("status");
const goBtn=document.getElementById("go");

let stream=null;
let front=true;
let skull=false;
let music=false;
let audioCtx=null;
let lastTrigger=0;
let manual=false;

async function startApp(){
  document.getElementById("start").style.display="none";

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:front ? "user" : "environment",
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject=stream;

    video.onloadedmetadata=()=>{
      canvas.width=video.videoWidth;
      canvas.height=video.videoHeight;
    };

    statusText.innerText="LOOK AT CAMERA 👀";

    initFaceMesh();
  }catch(e){
    statusText.innerText="CAMERA ACCESS DENIED";
    alert("Camera permission allow karo. HTTPS ya localhost par app open karo.");
  }
}

const faceMesh=new FaceMesh({
  locateFile:(file)=>{
    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
  }
});

faceMesh.setOptions({
  maxNumFaces:1,
  refineLandmarks:true,
  minDetectionConfidence:.55,
  minTrackingConfidence:.55
});

faceMesh.onResults(results=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(!results.multiFaceLandmarks ||
     results.multiFaceLandmarks.length===0){
    statusText.innerText="LOOK AT CAMERA 👀";
    return;
  }

  const lm=results.multiFaceLandmarks[0];

  const leftEye=lm[159];
  const rightEye=lm[386];

  /*
    Simple camera-facing check:
    both eyes and nose visible = face is looking
    generally toward camera.
  */
  const eyeDistance=Math.abs(rightEye.x-leftEye.x);

  if(eyeDistance>.035){
    if(!skull && Date.now()-lastTrigger>1500){
      activateSkull();
    }
  }

  if(skull){
    drawSkull(lm);
    statusText.innerText="CONFIDENCE MODE 💀";
  }
});

async function initFaceMesh(){
  async function process(){
    if(video.readyState>=2){
      await faceMesh.send({image:video});
    }
    requestAnimationFrame(process);
  }
  process();
}

function activateSkull(){
  skull=true;
  lastTrigger=Date.now();
  goBtn.classList.add("active");
  statusText.innerText="CONFIDENCE MODE 💀";

  if(!music){
    startFunk();
  }
}

function manualTrigger(){
  skull=!skull;

  if(skull){
    activateSkull();
  }else{
    goBtn.classList.remove("active");
    ctx.clearRect(0,0,canvas.width,canvas.height);
    statusText.innerText="LOOK AT CAMERA 👀";
  }
}

/* ---------- SKULL EDIT ---------- */

function drawSkull(lm){

  const W=canvas.width;
  const H=canvas.height;

  function P(i){
    return {
      x:(1-lm[i].x)*W,
      y:lm[i].y*H
    };
  }

  const top=P(10);
  const chin=P(152);
  const left=P(234);
  const right=P(454);
  const nose=P(1);

  const width=Math.abs(right.x-left.x);
  const height=Math.abs(chin.y-top.y);

  const cx=(left.x+right.x)/2;

  /* Skull base */

  ctx.save();

  ctx.globalAlpha=.82;
  ctx.fillStyle="white";
  ctx.strokeStyle="white";
  ctx.lineWidth=Math.max(3,width*.012);

  ctx.beginPath();

  ctx.ellipse(
    cx,
    top.y+height*.47,
    width*.48,
    height*.47,
    0,0,Math.PI*2
  );

  ctx.fill();

  /* Eye sockets */

  ctx.globalAlpha=1;
  ctx.fillStyle="#050505";

  const le=P(159);
  const re=P(386);

  ctx.beginPath();
  ctx.ellipse(
    le.x,
    le.y,
    width*.105,
    height*.065,
    0,0,Math.PI*2
  );
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(
    re.x,
    re.y,
    width*.105,
    height*.065,
    0,0,Math.PI*2
  );
  ctx.fill();

  /* Nose */

  ctx.beginPath();
  ctx.moveTo(nose.x,nose.y-height*.035);
  ctx.lineTo(nose.x-width*.055,nose.y+height*.07);
  ctx.lineTo(nose.x+width*.055,nose.y+height*.07);
  ctx.closePath();
  ctx.fill();

  /* Jaw */

  ctx.fillStyle="white";
  ctx.fillRect(
    cx-width*.19,
    chin.y-height*.16,
    width*.38,
    height*.14
  );

  /* Mouth */

  ctx.strokeStyle="#050505";
  ctx.lineWidth=Math.max(3,width*.012);

  ctx.beginPath();
  ctx.moveTo(cx-width*.17,chin.y-height*.105);
  ctx.lineTo(cx+width*.17,chin.y-height*.105);
  ctx.stroke();

  /* Teeth lines */

  for(let i=0;i<7;i++){
    const x=cx-width*.15+i*(width*.30/6);

    ctx.beginPath();
    ctx.moveTo(x,chin.y-height*.105);
    ctx.lineTo(x,chin.y-height*.035);
    ctx.stroke();
  }

  /* Forehead cracks - clean digital style */

  ctx.strokeStyle="#111";
  ctx.lineWidth=Math.max(2,width*.008);

  ctx.beginPath();
  ctx.moveTo(cx-width*.08,top.y+height*.13);
  ctx.lineTo(cx-width*.03,top.y+height*.21);
  ctx.lineTo(cx-width*.09,top.y+height*.29);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx+width*.08,top.y+height*.13);
  ctx.lineTo(cx+width*.03,top.y+height*.21);
  ctx.lineTo(cx+width*.09,top.y+height*.29);
  ctx.stroke();

  ctx.restore();
}

/* ---------- ORIGINAL FUNK-STYLE BEAT ---------- */

function startFunk(){

  music=true;

  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    funkLoop();
  }catch(e){}
}

function beat(freq,duration,type="sine",volume=.08){

  if(!audioCtx) return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(volume,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+duration);
}

function funkLoop(){

  if(!music) return;

  beat(65,.12,"sine",.18);

  setTimeout(()=>{
    if(!music)return;
    beat(140,.08,"square",.035);
  },130);

  setTimeout(()=>{
    if(!music)return;
    beat(75,.1,"sine",.13);
  },260);

  setTimeout(()=>{
    if(!music)return;
    beat(180,.06,"triangle",.035);
  },390);

  setTimeout(()=>{
    if(!music)return;
    beat(65,.12,"sine",.18);
  },520);

  setTimeout(()=>{
    if(!music)return;
    beat(110,.08,"square",.035);
  },650);

  setTimeout(funkLoop,800);
}

function toggleMusic(){

  if(!music){
    startFunk();
  }else{
    music=false;
    if(audioCtx){
      audioCtx.suspend();
    }
  }
}

/* ---------- CAMERA FLIP ---------- */

async function switchCamera(){

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }

  front=!front;

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:front ? "user" : "environment",
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject=stream;
  }catch(e){
    alert("Camera switch nahi ho paaya.");
  }
}

/* ---------- PHOTO ---------- */

function capture(){

  const photo=document.createElement("canvas");
  photo.width=canvas.width;
  photo.height=canvas.height;

  const pctx=photo.getContext("2d");

  pctx.save();

  if(front){
    pctx.translate(photo.width,0);
    pctx.scale(-1,1);
  }

  pctx.drawImage(
    video,
    0,0,
    photo.width,
    photo.height
  );

  pctx.restore();

  pctx.drawImage(
    canvas,
    0,0,
    photo.width,
    photo.height
  );

  const a=document.createElement("a");
  a.download="confidence-skull.png";
  a.href=photo.toDataURL("image/png");
  a.click();
}
</script>

</body>
</html>
