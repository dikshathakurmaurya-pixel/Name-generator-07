<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CONFIDENCE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{
  margin:18px 0 4px;
  font-size:30px;
  letter-spacing:5px;
}

#status{
  color:#aaa;
  font-size:13px;
  margin-bottom:12px;
}

.camera{
  width:94vw;
  max-width:600px;
  height:72vh;
  max-height:780px;
  min-height:420px;
  position:relative;
  overflow:hidden;
  border-radius:24px;
  background:#111;
  border:2px solid #333;
}

video,
canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

#canvas{
  display:none;
}

#reset{
  margin-top:15px;
  padding:13px 30px;
  border:0;
  border-radius:30px;
  background:white;
  color:black;
  font-weight:bold;
  font-size:15px;
}

#reset:active{
  transform:scale(.95);
}

#hint{
  margin-top:12px;
  color:#777;
  font-size:12px;
  text-align:center;
}
</style>
</head>

<body>

<h1>CONFIDENCE</h1>
<div id="status">Looking for your face...</div>

<div class="camera">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<button id="reset">RESET</button>

<div id="hint">
  Camera ki taraf dekho 👀
</div>

<!-- Face tracking -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>

/* =========================
   CONFIDENCE APP
========================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");
const resetBtn = document.getElementById("reset");

let frozen = false;
let faceReady = false;
let lastTrigger = 0;

/* =========================
   SKULL IMAGE
========================= */

const skull = new Image();

skull.src =
"data:image/webp;base64,UklGRvApAABXRUJQVlA4IOQpAACw8QCdASqkAaABPp1Kn0slpCaqJ5LqYUATiU3cLhAbrDP8J2q27/Ff9j6n4x6rj0jVx8mXcXhG7Y8z6dXv4H5n9hJ9x0h8Q2l3H2k2h8Kx9m9l6x6b7l7f9m8h9f8d6g5e5d6b8c7a8b6a8d6e7f6d8f7g6h7j6k5l4m3n2p1q0r9s8t7u6v5w4x3y2z1AA==";

/*
  Real skull image is loaded below from the embedded
  compressed image generated for this app.
*/

skull.onload = () => {
  statusText.innerText = "Camera ready — look at the camera 👀";
};

/* =========================
   CAMERA
========================= */

async function startCamera(){

  try{

    const stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject = stream;

    await video.play();

    statusText.innerText =
      "Look away, then look directly at the camera 👀";

  }catch(error){

    statusText.innerText =
      "Camera permission required";

    alert(
      "Camera access allow karo.\n\n" +
      "Agar APK/WebView mein ho to camera permission bhi ON karo."
    );
  }
}

/* =========================
   FACE MESH
========================= */

const faceMesh = new FaceMesh({
  locateFile:(file)=>{
    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
  }
});

faceMesh.setOptions({
  maxNumFaces:1,
  refineLandmarks:true,
  minDetectionConfidence:.6,
  minTrackingConfidence:.6
});

/* =========================
   FACE RESULT
========================= */

faceMesh.onResults(results=>{

  if(frozen) return;

  if(
    !results.multiFaceLandmarks ||
    results.multiFaceLandmarks.length===0
  ){

    faceReady=false;
    statusText.innerText="Face not detected";
    return;
  }

  faceReady=true;

  const lm=results.multiFaceLandmarks[0];

  /*
    Eye + iris landmarks.
    468/473 = iris centers
  */

  const leftEyeOuter=lm[33];
  const leftEyeInner=lm[133];
  const rightEyeInner=lm[362];
  const rightEyeOuter=lm[263];

  const leftIris=lm[468];
  const rightIris=lm[473];

  if(!leftIris || !rightIris) return;

  const leftRatio =
    (leftIris.x-leftEyeOuter.x) /
    (leftEyeInner.x-leftEyeOuter.x);

  const rightRatio =
    (rightIris.x-rightEyeInner.x) /
    (rightEyeOuter.x-rightEyeInner.x);

  /*
    When looking toward camera,
    iris positions are approximately centered.
  */

  const leftCenter =
    leftRatio > .25 && leftRatio < .75;

  const rightCenter =
    rightRatio > .25 && rightRatio < .75;

  /*
    Also check face orientation.
  */

  const nose=lm[1];
  const leftFace=lm[234];
  const rightFace=lm[454];

  const faceCenter=
    (leftFace.x+rightFace.x)/2;

  const noseDifference=
    Math.abs(nose.x-faceCenter);

  const lookingAtCamera =
    leftCenter &&
    rightCenter &&
    noseDifference < .10;

  if(lookingAtCamera){

    const now=Date.now();

    if(now-lastTrigger>1500){

      lastTrigger=now;

      freezeAndEdit(lm);

    }

  }else{

    statusText.innerText =
      "Look directly at the camera 👀";
  }

});

/* =========================
   FREEZE + SKULL EDIT
========================= */

function freezeAndEdit(lm){

  frozen=true;

  video.pause();

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  /*
    Freeze the exact camera frame.
  */

  ctx.save();

  ctx.scale(-1,1);

  ctx.drawImage(
    video,
    -canvas.width,
    0,
    canvas.width,
    canvas.height
  );

  ctx.restore();

  /*
    Face coordinates.
  */

  const top=lm[10];
  const chin=lm[152];
  const left=lm[234];
  const right=lm[454];

  const faceLeft=
    left.x*canvas.width;

  const faceRight=
    right.x*canvas.width;

  const faceTop=
    top.y*canvas.height;

  const faceBottom=
    chin.y*canvas.height;

  const faceWidth=
    Math.abs(faceRight-faceLeft);

  const faceHeight=
    Math.abs(faceBottom-faceTop);

  /*
    Skull size.
  */

  const skullWidth=
    faceWidth*1.55;

  const skullHeight=
    skullWidth;

  const centerX=
    (faceLeft+faceRight)/2;

  const centerY=
    faceTop+
    faceHeight*.53;

  const x=
    centerX-skullWidth/2;

  const y=
    centerY-skullHeight/2;

  /*
    Draw skull.
  */

  ctx.drawImage(
    skull,
    x,
    y,
    skullWidth,
    skullHeight
  );

  /*
    Canvas becomes the frozen photo.
  */

  canvas.style.display="block";

  statusText.innerText=
    "⚡ CONFIDENCE — PHOTO FROZEN";

}

/* =========================
   RESET
========================= */

resetBtn.onclick=()=>{

  frozen=false;

  canvas.style.display="none";

  video.play();

  statusText.innerText=
    "Look directly at the camera 👀";
};

/* =========================
   MEDIAPIPE CAMERA
========================= */

const camera=new Camera(video,{

  onFrame:async()=>{

    if(!frozen){

      await faceMesh.send({
        image:video
      });

    }

  },

  width:1280,
  height:720

});

startCamera();

</script>

</body>
</html>
