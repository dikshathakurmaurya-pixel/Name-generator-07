<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CONFIDENCE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{
  margin:18px 0 5px;
  font-size:30px;
  letter-spacing:6px;
}

#status{
  color:#aaa;
  font-size:13px;
  margin-bottom:12px;
}

.camera{
  width:94vw;
  max-width:600px;
  height:72vh;
  min-height:430px;
  position:relative;
  overflow:hidden;
  border-radius:24px;
  background:#111;
  border:2px solid #333;
}

video,
canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

canvas{
  display:none;
}

button{
  margin-top:15px;
  padding:13px 28px;
  border:0;
  border-radius:30px;
  background:#fff;
  color:#000;
  font-weight:bold;
  font-size:15px;
}

#save{
  display:none;
}

#hint{
  margin-top:10px;
  color:#777;
  font-size:12px;
  text-align:center;
}
</style>
</head>

<body>

<h1>CONFIDENCE</h1>

<div id="status">
Starting camera...
</div>

<div class="camera">

  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>

  <canvas id="canvas"></canvas>

</div>

<button id="reset">RESET</button>
<button id="save">SAVE PHOTO</button>

<div id="hint">
  Camera se thoda side dekho → phir directly camera mein dekho 👀
</div>


<!-- MediaPipe Face Mesh -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

/* =====================================================
   CONFIDENCE
   Automatic camera-look detection + frozen skull photo
===================================================== */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const resetBtn = document.getElementById("reset");
const saveBtn = document.getElementById("save");

let frozen = false;
let triggerLock = false;


/* =====================================================
   EMBEDDED SKULL PNG
   ===================================================== */

const skull = new Image();

skull.src = "data:image/png;base64,REPLACE_SKULL_DATA_HERE";


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },

        audio:false

      });

    video.srcObject = stream;

    await video.play();

    statusText.innerText =
      "Look directly at the camera 👀";

  }

  catch(error){

    statusText.innerText =
      "Camera permission required";

    alert(
      "Camera permission allow karo.\n\n" +
      "HTTPS ya localhost par app open karo."
    );

  }

}


/* =====================================================
   FACE MESH
===================================================== */

const faceMesh = new FaceMesh({

  locateFile:function(file){

    return
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;

  }

});


faceMesh.setOptions({

  maxNumFaces:1,

  refineLandmarks:true,

  minDetectionConfidence:0.6,

  minTrackingConfidence:0.6

});


/* =====================================================
   FACE DETECTED
===================================================== */

faceMesh.onResults(function(results){

  if(frozen) return;

  if(
    !results.multiFaceLandmarks ||
    results.multiFaceLandmarks.length === 0
  ){

    statusText.innerText =
      "Face not detected";

    return;

  }


  const lm =
    results.multiFaceLandmarks[0];


  /*
    Nose + face sides
  */

  const nose = lm[1];

  const leftFace = lm[234];

  const rightFace = lm[454];


  const faceCenter =
    (leftFace.x + rightFace.x) / 2;


  const difference =
    Math.abs(nose.x - faceCenter);


  /*
    Eye landmarks
  */

  const leftOuter = lm[33];
  const leftInner = lm[133];

  const rightInner = lm[362];
  const rightOuter = lm[263];


  const leftEyeCenter =
    (leftOuter.x + leftInner.x) / 2;

  const rightEyeCenter =
    (rightInner.x + rightOuter.x) / 2;


  /*
    Approximate camera-facing check
  */

  const noseCentered =
    difference < 0.09;


  const faceFacingCamera =
    noseCentered;


  if(faceFacingCamera && !triggerLock){

    triggerLock = true;

    statusText.innerText =
      "⚡ CAPTURE!";

    setTimeout(function(){

      freezeAndApplySkull(lm);

    },350);

  }

  else if(!triggerLock){

    statusText.innerText =
      "Look directly at the camera 👀";

  }

});


/* =====================================================
   FREEZE PHOTO + APPLY SKULL
===================================================== */

function freezeAndApplySkull(lm){

  frozen = true;

  video.pause();


  /*
    Canvas actual camera resolution
  */

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;


  /*
    Freeze camera frame
  */

  ctx.save();

  ctx.scale(-1,1);

  ctx.drawImage(

    video,

    -canvas.width,
    0,
    canvas.width,
    canvas.height

  );

  ctx.restore();


  /*
    Face landmarks
  */

  const forehead = lm[10];

  const chin = lm[152];

  const left = lm[234];

  const right = lm[454];


  const leftX =
    left.x * canvas.width;

  const rightX =
    right.x * canvas.width;

  const topY =
    forehead.y * canvas.height;

  const bottomY =
    chin.y * canvas.height;


  /*
    Face dimensions
  */

  const faceWidth =
    Math.abs(rightX - leftX);

  const faceHeight =
    Math.abs(bottomY - topY);


  /*
    Skull dimensions
  */

  const skullWidth =
    faceWidth * 1.65;

  const skullHeight =
    skullWidth *
    (skull.height / skull.width);


  /*
    Center of face
  */

  const centerX =
    (leftX + rightX) / 2;

  const centerY =
    topY + faceHeight * 0.52;


  /*
    Skull position
  */

  const x =
    centerX - skullWidth / 2;

  const y =
    centerY - skullHeight / 2;


  /*
    Draw skull
  */

  if(skull.complete){

    ctx.drawImage(

      skull,

      x,
      y,
      skullWidth,
      skullHeight

    );

  }


  /*
    Show frozen image
  */

  canvas.style.display = "block";

  saveBtn.style.display = "block";

  statusText.innerText =
    "SKULL EDIT APPLIED ⚡";

}


/* =====================================================
   RESET
===================================================== */

resetBtn.onclick = function(){

  frozen = false;

  triggerLock = false;

  canvas.style.display = "none";

  saveBtn.style.display = "none";

  video.play();

  statusText.innerText =
    "Look directly at the camera 👀";

};


/* =====================================================
   SAVE PHOTO
===================================================== */

saveBtn.onclick = function(){

  const link =
    document.createElement("a");

  link.download =
    "CONFIDENCE_SKULL.png";

  link.href =
    canvas.toDataURL("image/png");

  link.click();

};


/* =====================================================
   MEDIAPIPE CAMERA LOOP
===================================================== */

const camera =
  new Camera(video,{

    onFrame:async function(){

      if(!frozen){

        await faceMesh.send({

          image:video

        });

      }

    },

    width:1280,

    height:720

  });


/* START */

startCamera();

</script>

</body>
</html>
