<!<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Pink Font Generator</title>

</head>

<body>
<div class="mode-frame">
    <input type="radio" id="option-1" name="segmented-options" value="1" checked>
    <label for="option-1">Light</label>

    <input type="radio" id="option-2" name="segmented-options" value="2">
    <label for="option-2">Dark</label>
</div>

<div class="container">

<header>

    <div class="logo">
        FONT <span>GENERATOR</span>
    </div>

    <div class="subtitle">
        Create stylish text instantly.
    </div>

</header>


<textarea
    id="textInput"
    placeholder="Type your text here..."
></textarea>


<input
    type="text"
    id="searchInput"
    class="search"
    placeholder="🔍 Search fonts..."
>


<div id="fontList" class="font-list"></div>


<footer>
    Made with ❤️ • Font Generator
</footer>

</div>


<script src="script.js"></script>

</body>
</html>
