 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CONFIDENCE</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:900;
  letter-spacing:5px;
}

#camera{
  position:relative;
  width:94%;
  height:calc(100vh - 150px);
  margin:auto;
  border-radius:25px;
  overflow:hidden;
  background:#111;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:none;
}

#status{
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.7);
  padding:10px 17px;
  border-radius:25px;
  font-size:12px;
  letter-spacing:1px;
  z-index:5;
  white-space:nowrap;
}

#reset{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:none;
  border:0;
  border-radius:15px;
  padding:14px 25px;
  font-weight:bold;
  background:white;
  color:black;
  z-index:20;
}

#start{
  position:fixed;
  inset:0;
  background:#050505;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
}

#start h1{
  font-size:42px;
  letter-spacing:7px;
  margin:0;
}

#start p{
  color:#aaa;
}

#start button{
  border:0;
  background:white;
  color:black;
  padding:16px 35px;
  border-radius:15px;
  font-weight:bold;
  font-size:16px;
}
</style>
</head>

<body>

<div id="start">
  <h1>CONFIDENCE</h1>
  <p>Look away... then look into the camera.</p>
  <button onclick="startCamera()">START</button>
</div>

<header>CONFIDENCE</header>

<div id="camera">

  <video id="video" autoplay playsinline muted></video>

  <canvas id="output"></canvas>

  <div id="status">LOOK AWAY FIRST 👈</div>

</div>

<button id="reset" onclick="resetApp()">TRY AGAIN 🔄</button>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("output");
const ctx=canvas.getContext("2d");
const statusBox=document.getElementById("status");
const resetBtn=document.getElementById("reset");

let stream=null;
let triggered=false;
let lookedAway=false;
let lastFaceTime=0;
let audioCtx=null;
let musicStarted=false;


/* =========================
   START CAMERA
========================= */

async function startCamera(){

  document.getElementById("start").style.display="none";

  try{

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject=stream;

    video.onloadedmetadata=()=>{

      canvas.width=video.videoWidth;
      canvas.height=video.videoHeight;

      detectFace();
    };

  }catch(error){

    statusBox.innerText="CAMERA PERMISSION REQUIRED";

    alert(
      "Camera permission allow karo. " +
      "Chrome/HTTPS ya localhost par app open karo."
    );
  }
}


/* =========================
   MEDIAPIPE FACE MESH
========================= */

const faceMesh=new FaceMesh({

  locateFile:(file)=>{
    return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"+file;
  }

});

faceMesh.setOptions({

  maxNumFaces:1,
  refineLandmarks:true,
  minDetectionConfidence:.6,
  minTrackingConfidence:.6

});


faceMesh.onResults(results=>{

  if(triggered) return;

  if(
    !results.multiFaceLandmarks ||
    results.multiFaceLandmarks.length===0
  ){
    statusBox.innerText="LOOK AT CAMERA 👀";
    return;
  }

  const face=results.multiFaceLandmarks[0];

  const leftEyeOuter=face[33];
  const leftEyeInner=face[133];

  const rightEyeInner=face[362];
  const rightEyeOuter=face[263];

  const nose=face[1];

  /*
    Eye/face geometry.
    Pehle user ko thoda side dekhna hoga.
    Phir camera ki taraf dekhne par
    trigger activate hoga.
  */

  const leftCenterX=
    (leftEyeOuter.x+leftEyeInner.x)/2;

  const rightCenterX=
    (rightEyeInner.x+rightEyeOuter.x)/2;

  const eyeCenter=
    (leftCenterX+rightCenterX)/2;

  const faceCenter=nose.x;

  const difference=Math.abs(
    eyeCenter-faceCenter
  );

  /*
    Jab face camera se hatkar dekhta hai,
    geometry change hoti hai.
  */

  if(difference>.018){

    lookedAway=true;

    statusBox.innerText="NOW LOOK AT CAMERA 👀";

    return;
  }

  /*
    Look-away ke baad camera ki taraf
    wapas dekhte hi capture.
  */

  if(lookedAway){

    if(Date.now()-lastFaceTime>900){

      lastFaceTime=Date.now();

      freezeAndEdit(face);

    }

  }

});


/* =========================
   FACE DETECTION LOOP
========================= */

async function detectFace(){

  if(triggered) return;

  if(video.readyState>=2){

    await faceMesh.send({
      image:video
    });

  }

  requestAnimationFrame(detectFace);
}


/* =========================
   FREEZE + PHOTO
========================= */

function freezeAndEdit(face){

  triggered=true;

  statusBox.innerText="FREEZING... 💀";

  /*
    Stop live camera.
  */

  if(stream){

    stream.getTracks().forEach(track=>{
      track.stop();
    });

  }

  /*
    Capture exact current frame.
  */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.save();

  /*
    Selfie mirror.
  */

  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.restore();

  /*
    Video ke mirror ko match karne ke liye
    landmarks ko canvas coordinates mein convert.
  */

  drawSkull(face);

  canvas.style.display="block";
  video.style.display="none";

  statusBox.innerText="CONFIDENCE MODE 💀";

  resetBtn.style.display="block";

  startFunk();

}


/* =========================
   SKULL EDIT
========================= */

function drawSkull(face){

  const W=canvas.width;
  const H=canvas.height;

  function point(index){

    return{

      x:(1-face[index].x)*W,
      y:face[index].y*H

    };

  }

  const top=point(10);
  const chin=point(152);
  const left=point(234);
  const right=point(454);

  const nose=point(1);

  const leftEye=point(159);
  const rightEye=point(386);

  const width=Math.abs(
    right.x-left.x
  );

  const height=Math.abs(
    chin.y-top.y
  );

  const cx=(left.x+right.x)/2;

  ctx.save();

  /*
    Skull face.
  */

  ctx.globalAlpha=.88;

  ctx.fillStyle="#ffffff";

  ctx.beginPath();

  ctx.ellipse(
    cx,
    top.y+height*.46,
    width*.47,
    height*.46,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    Eye sockets.
  */

  ctx.globalAlpha=1;

  ctx.fillStyle="#050505";

  ctx.beginPath();

  ctx.ellipse(
    leftEye.x,
    leftEye.y,
    width*.105,
    height*.065,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.ellipse(
    rightEye.x,
    rightEye.y,
    width*.105,
    height*.065,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    Nose socket.
  */

  ctx.beginPath();

  ctx.moveTo(
    nose.x,
    nose.y-height*.035
  );

  ctx.lineTo(
    nose.x-width*.055,
    nose.y+height*.065
  );

  ctx.lineTo(
    nose.x+width*.055,
    nose.y+height*.065
  );

  ctx.closePath();

  ctx.fill();


  /*
    Jaw.
  */

  ctx.fillStyle="#ffffff";

  ctx.fillRect(
    cx-width*.19,
    chin.y-height*.16,
    width*.38,
    height*.14
  );


  /*
    Mouth.
  */

  ctx.strokeStyle="#050505";

  ctx.lineWidth=Math.max(
    3,
    width*.012
  );

  ctx.beginPath();

  ctx.moveTo(
    cx-width*.17,
    chin.y-height*.105
  );

  ctx.lineTo(
    cx+width*.17,
    chin.y-height*.105
  );

  ctx.stroke();


  /*
    Teeth.
  */

  for(let i=0;i<7;i++){

    const x=
      cx-width*.15+
      i*(width*.30/6);

    ctx.beginPath();

    ctx.moveTo(
      x,
      chin.y-height*.105
    );

    ctx.lineTo(
      x,
      chin.y-height*.035
    );

    ctx.stroke();

  }


  /*
    Digital skull cracks.
  */

  ctx.strokeStyle="#111";
  ctx.lineWidth=Math.max(
    2,
    width*.008
  );

  ctx.beginPath();

  ctx.moveTo(
    cx-width*.08,
    top.y+height*.13
  );

  ctx.lineTo(
    cx-width*.03,
    top.y+height*.21
  );

  ctx.lineTo(
    cx-width*.09,
    top.y+height*.29
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    cx+width*.08,
    top.y+height*.13
  );

  ctx.lineTo(
    cx+width*.03,
    top.y+height*.21
  );

  ctx.lineTo(
    cx+width*.09,
    top.y+height*.29
  );

  ctx.stroke();


  ctx.restore();
}


/* =========================
   ORIGINAL FUNK-STYLE BEAT
========================= */

function startFunk(){

  if(musicStarted) return;

  musicStarted=true;

  try{

    audioCtx=
      new(window.AudioContext||
      window.webkitAudioContext)();

    audioCtx.resume();

    funkBeat();

  }catch(e){}

}


function sound(
  frequency,
  duration,
  type,
  volume
){

  if(!audioCtx) return;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type=type;

  osc.frequency.value=frequency;

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime+duration
  );
}


function funkBeat(){

  if(!musicStarted) return;

  sound(55,.14,"sine",.20);

  setTimeout(()=>{
    sound(150,.07,"square",.035);
  },120);

  setTimeout(()=>{
    sound(75,.10,"sine",.14);
  },250);

  setTimeout(()=>{
    sound(190,.06,"triangle",.03);
  },380);

  setTimeout(()=>{
    sound(55,.14,"sine",.20);
  },500);

  setTimeout(()=>{
    sound(125,.07,"square",.035);
  },650);

  setTimeout(funkBeat,800);
}


/* =========================
   RESET
========================= */

function resetApp(){

  location.reload();

}

</script>

</body>
</html>

Note: Tumhare Spotify link wale exact track ko app mein directly embed nahi kiya hai; Spotify link khud audio file nahi deta. Is code mein us moment par original funk-style beat automatically start hota hai.
